<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Noord Installatie LeadFlow</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>


    <!-- =========================
         LOGIN
    ========================== -->

    <div id="loginScherm">

        <h1>
            Noord Installatie
        </h1>

        <h2>
            LeadFlow Login
        </h2>


        <input
            type="email"
            id="gebruikersnaam"
            placeholder="E-mailadres"
        >


        <input
            type="password"
            id="wachtwoord"
            placeholder="Wachtwoord"
        >


        <button id="loginKnop">
            Inloggen
        </button>


        <p id="loginFout"></p>

    </div>



    <!-- =========================
         DASHBOARD
    ========================== -->

    <div
        id="appInhoud"
        style="display: none;"
    >


        <h1>
            Noord Installatie LeadFlow
        </h1>


        <button id="uitloggenKnop">
            Uitloggen
        </button>



        <!-- =========================
             STATISTIEKEN
        ========================== -->

        <div class="statistieken">


            <div class="statistiek-kaart">

                <h3>
                    Totaal
                </h3>

                <p id="totaalLeads">
                    0
                </p>

            </div>


            <div class="statistiek-kaart">

                <h3>
                    HOT
                </h3>

                <p id="hotLeads">
                    0
                </p>

            </div>


            <div class="statistiek-kaart">

                <h3>
                    WARM
                </h3>

                <p id="warmLeads">
                    0
                </p>

            </div>


            <div class="statistiek-kaart">

                <h3>
                    COLD
                </h3>

                <p id="coldLeads">
                    0
                </p>

            </div>

        </div>



        <!-- =========================
             NIEUWE LEAD
        ========================== -->

        <form id="leadFormulier">

            <h2>
                Nieuwe lead
            </h2>


            <label>
                Naam
            </label>

            <input
                type="text"
                id="naam"
                placeholder="Naam klant"
                required
            >


            <label>
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="E-mailadres"
                required
            >


            <label>
                Telefoon
            </label>

            <input
                type="text"
                id="telefoon"
                placeholder="Telefoonnummer"
            >


            <label>
                Postcode
            </label>

            <input
                type="text"
                id="postcode"
                placeholder="Bijvoorbeeld 9201BP"
            >


            <label>
                Urgentie
            </label>

            <select id="urgentie" required>

                <option value="">
                    Kies urgentie
                </option>

                <option value="Vandaag">
                    Vandaag
                </option>

                <option value="Deze week">
                    Deze week
                </option>

                <option value="Later">
                    Later
                </option>

            </select>


            <label>
                Budget
            </label>

            <select id="budget" required>

                <option value="">
                    Kies budget
                </option>

                <option value="Hoog">
                    Hoog
                </option>

                <option value="Middel">
                    Middel
                </option>

                <option value="Laag">
                    Laag
                </option>

            </select>


            <label>
                Project
            </label>

            <select id="project" required>

                <option value="">
                    Kies project
                </option>

                <option value="Grote installatie">
                    Grote installatie
                </option>

                <option value="Nieuwe installatie">
                    Nieuwe installatie
                </option>

                <option value="Kleine reparatie">
                    Kleine reparatie
                </option>

            </select>


            <button type="submit">
                Lead analyseren
            </button>

        </form>



        <!-- =========================
             ZOEKEN
        ========================== -->

        <input
            type="text"
            id="zoekveld"
            placeholder="Zoek op naam, e-mail of postcode..."
        >



        <!-- =========================
             FILTERS
        ========================== -->

        <div class="filters">

            <button data-filter="ALLE">
                Alle
            </button>

            <button data-filter="HOT">
                HOT
            </button>

            <button data-filter="WARM">
                WARM
            </button>

            <button data-filter="COLD">
                COLD
            </button>

        </div>



        <!-- =========================
             LEADS
        ========================== -->

        <div id="leadLijst"></div>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="script.js"
    ></script>


</body>

</html>
